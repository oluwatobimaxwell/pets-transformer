# The page and the API share one address, so the browser needs no CORS and the API port stays private to Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No limit here: the API owns the upload limit (MAX_UPLOAD_MB) and refuses anything larger.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Detect reads every column of an upload before it answers.
        proxy_read_timeout 300s;
    }

    # File names under /assets/ change with every build, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
