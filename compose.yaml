# The whole tool in Docker. Needs a .env next to this file with PETS_ROOT (where the challenge package is) and PETS_ENGINE_KEY.
#   Web app:       docker compose up --build        then open http://localhost:8080
#   Command line:  docker compose run --rm engine run /data/challenge/data/health --scenario HEALTH-S1 --out runs/health-s1
name: pets-transformer

x-challenge: &challenge "${PETS_ROOT:?Set PETS_ROOT in .env (see README.md)}:/data/challenge:ro"

x-engine: &engine
  image: pets-transformer-engine
  build:
    context: .
    dockerfile: docker/engine.Dockerfile
    additional_contexts:
      toolkit: "${PETS_ROOT:?Set PETS_ROOT in .env (see README.md)}/toolkit"
  environment:
    PETS_ENGINE_KEY: "${PETS_ENGINE_KEY:?Set PETS_ENGINE_KEY in .env (see README.md)}"

services:
  api:
    <<: *engine
    volumes:
      - *challenge
      - workspace:/app/workspace
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    # Local only: the app has no sign-in, so it must never listen on a network address.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # The command line, on demand. This folder is mounted at /work, so runs/ and your own data stay on your machine.
  engine:
    <<: *engine
    profiles: [cli]
    entrypoint: ["pets-engine"]
    working_dir: /work
    volumes:
      - *challenge
      - .:/work

volumes:
  workspace:
